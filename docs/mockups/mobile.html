<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klasma · 手机端布局评审</title>

  <body>
    <header class="preview-toolbar">
      <div><a href="index.html">← 桌面原型</a><h1>手机端布局评审</h1></div>
      <label>视口尺寸 <select id="viewport-size"><option value="360,800">360 × 800</option><option value="375,812">375 × 812</option><option value="390,844" selected>390 × 844</option><option value="430,932">430 × 932</option><option value="320,568">320 × 568 · 窄屏</option></select></label>

    </header>
    <p class="preview-note">每个窗口均可独立操作。首页向下浏览三张牌；软件 B 为短文样本，其余为长文；分类先点选预览，再点缩略图。布局与视觉数值均为候选。</p>
    <main class="preview-grid" id="preview-grid"></main>
    <script src="mobile.js"></script>
